; DashboardESP Firmware V0.3.23
; WAVESHARE 7-inch: proven CantineMenu driver / LVGL 8.3.11 / pioarduino
; Original 3.5-inch boards retain LovyanGFX / LVGL 9.2.2.

[platformio]
default_envs = dashboardesp_035c_portrait

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
; ESP32 classic 4MB: one 3MB factory app + 960KB LittleFS (no OTA slots)
board_build.partitions = partitions_4mb_large_app.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LGFX_USE_V1
    -D DASH_LCD_SPI_WRITE_HZ=27000000UL
    -D DASH_LCD_SPI_READ_HZ=16000000UL
    -D DASH_VERSION=\"0.3.23\"
    -D CORE_DEBUG_LEVEL=1
monitor_filters = esp32_exception_decoder, time

; ESP32-3248S035C: display configuration reproduced from working TFT_eSPI project.
; User-provided GPIO, controller and clocks have priority over LovyanGFX.
[esp035c]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@6.21.5
build_flags =
    ${env.build_flags}
    -D DASH_DISPLAY_TFT_ESPI=1
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

[env:dashboardesp_035c_landscape]
lib_deps = ${esp035c.lib_deps}
build_flags =
    ${esp035c.build_flags}
    -D DASH_TOUCH_CAPACITIVE=1
    -D DASH_ROTATION=1

[env:dashboardesp_035c_portrait]
lib_deps = ${esp035c.lib_deps}
build_flags =
    ${esp035c.build_flags}
    -D DASH_TOUCH_CAPACITIVE=1
    -D DASH_ROTATION=0

; Experimental CYD variants: ILI9341 + separate XPT2046 SPI bus.
; ESP32-2432S028R pinout confirmed by community references; touch
; calibration and specific revisions require a test before Jeedom ACTION use.
[cyd_spi]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@6.21.5
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    ${env.build_flags}
    -D DASH_DISPLAY_TFT_ESPI=1
    -D DASH_TOUCH_RESISTIVE=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

[env:dashboardesp_2432s028r_portrait]
lib_deps = ${cyd_spi.lib_deps}
build_flags =
    ${cyd_spi.build_flags}
    -D DASH_BOARD_CYD_28=1
    -D DASH_ROTATION=0

[env:dashboardesp_2432s028r_landscape]
lib_deps = ${cyd_spi.lib_deps}
build_flags =
    ${cyd_spi.build_flags}
    -D DASH_BOARD_CYD_28=1
    -D DASH_ROTATION=1

; WARNING: 2432S024 variants have resistive and capacitive panels.
; This profile is only for the ILI9341/XPT2046 R variant. Pins need proof.
[env:dashboardesp_2432s024r_portrait_EXPERIMENTAL]
lib_deps = ${cyd_spi.lib_deps}
build_flags =
    ${cyd_spi.build_flags}
    -D DASH_BOARD_CYD_24=1
    -D DASH_ROTATION=0

; ESP32-1732S019C (capacitive version only): ESP32-S3, ST7789 170x320,
; GT911. Experimental: GPIOs based on published hardware pinout, not bench tested.
; DO NOT use with ESP32-1732S019N (no touchscreen).
[env:dashboardesp_1732s019c_portrait_EXPERIMENTAL]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_16mb.csv
lib_deps = ${esp035c.lib_deps}
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D DASH_BOARD_1732S019C=1
    -D DASH_DISPLAY_TFT_ESPI=1
    -D DASH_TOUCH_CAPACITIVE=1
    -D DASH_ROTATION=0
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_MISO=-1
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=11
    -D TFT_RST=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

[env:dashboardesp_035r_landscape]
build_flags =
    ${env.build_flags}
    -D DASH_TOUCH_RESISTIVE=1
    -D DASH_ROTATION=1

[env:dashboardesp_035r_portrait]
build_flags =
    ${env.build_flags}
    -D DASH_TOUCH_RESISTIVE=1
    -D DASH_ROTATION=0

; Waveshare configuration taken from user supplied CantineMenuESP32_PlatformIO.
; Flash 8MB and OPI PSRAM match the earlier working ESPHome configuration.
[wave7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
; Arduino ESP32 3.x: chain+ may hide Network.h from framework WiFi.
; Keep plain chain so the built-in Network dependency is discovered.
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    https://github.com/iamfaraz/Waveshare_ST7262_LVGL.git
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v0.1.6
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v0.0.3
    https://github.com/lvgl/lvgl.git#v8.3.11
; Ne pas ajouter esp-lib-utils ici : Waveshare_ST7262_LVGL
; est ecrit pour les API ESP32_Display_Panel 0.1.x / IO_Expander 0.0.x.
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D DASH_VERSION=\"0.3.23\"
    -D DASH_BOARD_WAVESHARE_7=1
    -D ESP_PANEL_USE_CUSTOM_BOARD=1
    -D DASH_LVGL8=1
    ; Alias compatible avec ESP32_IO_Expander v0.0.3.
    -D ESP_IO_EXPANDER_I2C_CH422G_ADDRESS=ESP_IO_EXPANDER_I2C_CH422G_ADDRESS_000

[env:dashboardesp_waveshare_s3_7_landscape]
extends = wave7
build_flags =
    ${wave7.build_flags}
    -D DASH_ROTATION=0

; Experimental Waveshare ESP32-S3-Touch-LCD-4.3 (800x480 ST7262/GT911).
; The 7-inch driver is used as a provisional port; electrical pin and
; RGB timing confirmation on the actual 4.3-inch revision is mandatory.
[env:dashboardesp_waveshare_s3_43_landscape_EXPERIMENTAL]
extends = wave7
build_flags =
    ${wave7.build_flags}
    -D DASH_BOARD_WAVESHARE_43=1
    -D DASH_ROTATION=0

[env:dashboardesp_waveshare_s3_7_lcd_test]
extends = wave7
; LCD only: do not compile DashboardRuntime.cpp (which includes WiFi/Network).
build_src_filter =
    +<main.cpp>
    +<DashboardDisplay.cpp>
    -<DashboardRuntime.cpp>
build_flags =
    ${wave7.build_flags}
    -D DASH_ROTATION=0
    -D DASH_LCD_DIAGNOSTIC=1

; Portrait requires a physical rotation supported by the panel driver.
; Not enabled until a portrait test is verified on this particular revision.

; Waveshare GT911 only. Reuses the proven LCD hardware driver of V0.2.9.
; No WiFi, HTTP server or JSON runtime compiled in this environment.
[env:dashboardesp_waveshare_s3_7_touch_test]
extends = wave7
build_src_filter =
    +<main.cpp>
    +<DashboardDisplay.cpp>
    -<DashboardRuntime.cpp>
build_flags =
    ${wave7.build_flags}
    -D DASH_ROTATION=0
    -D DASH_TOUCH_DIAGNOSTIC=1

; Offline LVGL 8 demo, with JSON widgets + GT911 + page navigation.
; Isolated from the WiFi/Network library, like the validated touch test.
[env:dashboardesp_waveshare_s3_7_demo]
extends = wave7
build_src_filter =
    +<main.cpp>
    +<DashboardDisplay.cpp>
    +<DashboardDemo.cpp>
    -<DashboardRuntime.cpp>
build_flags =
    ${wave7.build_flags}
    -D DASH_ROTATION=0
    -D DASH_OFFLINE_DEMO=1

; ============================================================
; ESP32-3248S035C DISPLAY DIAGNOSTIC ONLY (NO WIFI/LVGL)
; Same ST7796 pin mapping, VSPI host, 27 MHz from working TFT_eSPI.
; ============================================================
[env:dashboardesp_035c_portrait_lcd_test]
extends = env:dashboardesp_035c_portrait
build_src_filter =
    +<DashboardDisplay.cpp>
    +<LcdDiagnostic035.cpp>
    -<main.cpp>
    -<DashboardRuntime.cpp>
    -<DashboardDemo.cpp>
build_flags =
    ${env:dashboardesp_035c_portrait.build_flags}
    -D DASH_LCD_DIAGNOSTIC_035=1

[env:dashboardesp_035c_landscape_lcd_test]
extends = env:dashboardesp_035c_landscape
build_src_filter =
    +<DashboardDisplay.cpp>
    +<LcdDiagnostic035.cpp>
    -<main.cpp>
    -<DashboardRuntime.cpp>
    -<DashboardDemo.cpp>
build_flags =
    ${env:dashboardesp_035c_landscape.build_flags}
    -D DASH_LCD_DIAGNOSTIC_035=1

; ============================================================
; ESP32-3248S035C CAPACITIVE TOUCH TEST (TFT_eSPI + GT911 ONLY)
; No WiFi, no JSON, no LVGL - preserves proven ST7796 display backend.
; ============================================================
[env:dashboardesp_035c_portrait_touch_test]
extends = env:dashboardesp_035c_portrait
build_src_filter =
    +<DashboardDisplay.cpp>
    +<TouchDiagnostic035.cpp>
    -<main.cpp>
    -<DashboardRuntime.cpp>
    -<DashboardDemo.cpp>
build_flags =
    ${env:dashboardesp_035c_portrait.build_flags}
    -D DASH_TOUCH_DIAGNOSTIC_035=1
